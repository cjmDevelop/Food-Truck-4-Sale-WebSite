<body>
  <header>
    <a href="index.html">
      <img src="/logo-guyana-usa-theme.png" alt="Backyard Builds Logo" />

    <nav>
      <a href="index.html">Home</a>

   <h1>FOR SALE</h1>
  <main>
        <div class="slider-container">
          <button class="prev">&#10094;</button>
          <div class="slider">
            <div class="slide">
              <div class="image-wrapper">
                <img src="/2025_FoodTruckPics/IMG_1215.JPEG" alt="Food Truck image 1" />
              </div>
            </div>
            <div class="slide">
              <div class="image-wrapper">
                <img loading="lazy" src="/2025_FoodTruckPics/IMG_1216.JPEG" alt="Food Truck image 2" />
              </div>
            </div>
            <div class="slide">
              <div class="image-wrapper">
                <img loading="lazy" src="/2025_FoodTruckPics/IMG_1218.JPEG" alt="Food Truck image 3" />
              </div>
            </div>
          </div>
          <button class="next">&#10095;</button>
        </div>
        <h3 style="visibility: hidden;">.</h3>
  </main>
<div id="image-modal" class="modal">
    <span class="modal-close">&times;</span>
    <img class="modal-content" id="modal-img">
  </div>
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const modal = document.getElementById("image-modal");
    const modalImg = document.getElementById("modal-img");
    const closeBtn = document.querySelector(".modal-close");

    document.querySelectorAll(".slide img").forEach(img => {
      img.style.cursor = "pointer";
      img.addEventListener("click", () => {
        modal.style.display = "block";
        modalImg.src = img.src;
        modalImg.alt = img.alt;
      });
    });

    closeBtn.addEventListener("click", () => {
      modal.style.display = "none";
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.style.display = "none";
      }
    });
  });
</script>
