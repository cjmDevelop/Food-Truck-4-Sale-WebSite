<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Food Truck 4 Sale</title>
    <link rel="icon" href="public/yellowFoodTruckIcon.png">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        :root{
         --clear-line: #e3e3e3;
         --link-color: #929292;
        }
        *{
         padding: 0;
         margin: 0;
        }
        html{
          height: 100vh;
          width: 100vw;
        }
        body{
            height: 100%;
            font-family: "Poppins", sans-serif;
            font-weight: 400;
            font-style: normal;     
        }
        nav{
            padding: 1.6rem;   
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            width: 100%;
            border-bottom: 2px solid var(--clear-line);
        }
        nav a{
            margin: 0 3%;
            text-decoration: none;
            color: var(--link-color); 
        }
        nav a:hover{
            color: black;
        }
        nav a.active{
            color: black;
        }
        main{
            display: flex;
            margin-top: 4%;
            height: 75%;
            position: relative;
        }
        main #left{
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: absolute;
            top: 20%;
        }
        main #left h1{
            font-size: 3rem; 
        }
        h1 + p{
            width: 75%;
            margin: 35px auto;
        }
        main #right{
            width: 50%;
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        img{
            max-width: 50%;
        }
        #cta-button{
            text-transform: uppercase;
            background: linear-gradient(to right, grey, rgb(45, 45, 45));
            text-decoration: none;
            color: rgb(255, 255, 255);
            padding: 1em 3em;
            font-weight: 600;
            border-radius: 1000px;
            transition: 150ms ease;
        }
        #cta-button:hover{
            scale: 1.1;
        }
        #three-container{
            width: 100%;
            height: 100%;
            position: absolute;
            max-width: 50%;
            bottom: -20%;
            left: 25%;
            top: 2.5%;
        }
    </style>
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/"
          }
        }
      </script>
</head>
<body>
 <nav>
    <a href="index.html" class="active">Home</a>
    <a href="#">About</a>
    <a href="#">Projects</a>
    <a href="#">Contact</a>
 </nav>
 <main>
    <div id="left">
        <h1>Food Trucks Independently Built & Ready for Business</h1>
        <p>Ready to roll, newly equipped, and perfect for any cuisine! This food truck is the ultimate tool 
        for entrepreneurs wanting to take their business mobile. Call us today to make it yours!
        </p>
        <a href="#" id="cta-button">HAVE QUESTIONS? CONTACT US!</a>
    </div> 
    <div id="right">    
        <div id="three-container"></div>
    </div>
</main>
<script type="module" src="index.js"></script>
</body>
</html>
